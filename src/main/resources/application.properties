spring.application.name=spring-boot-api-reliability-starter
server.port=8080

# Idempotency configuration
reliability.idempotency.ttl=24h

# Correlation ID in application logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [correlationId=%X{correlationId}] %logger{36} - %msg%n
